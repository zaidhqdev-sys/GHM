name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/capability-gateway-qualification-20261110
      - construction/auth-issuer-isolation-20261112
      - construction/auth-issuer-stacked-on-pr272-20261113
  pull_request:
    branches:
      - main
      - feat/ghm-capability-evidence-admin-20261105

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ghm_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ghm_disposable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ghm_runtime:runtime-test-password@localhost:5432/ghm_disposable_test
      GHM_RUNTIME_DATABASE_URL: postgres://ghm_runtime:runtime-test-password@localhost:5432/ghm_disposable_test
      GHM_AUTH_ISSUER_DATABASE_URL: postgres://ghm_auth_issuer:auth-issuer-test-password@localhost:5432/ghm_disposable_test
      GHM_ACTOR_GATEWAY_DATABASE_URL: postgres://ghm_actor_gateway:actor-gateway-test-password@localhost:5432/ghm_disposable_test
      GHM_PAYMENT_PROVIDER_DATABASE_URL: postgres://ghm_payment_provider:provider-test-password@localhost:5432/ghm_disposable_test
      GHM_MIGRATOR_DATABASE_URL: postgres://ghm_migrator:migrator-test-password@localhost:5432/ghm_disposable_test
      GHM_MIGRATION_DATABASE_NAME: ghm_disposable_test
      GHM_MIGRATION_DATABASE_HOST: localhost
      GHM_QUALIFICATION_DATABASE_NAME: ghm_disposable_test
      GHM_QUALIFICATION_DATABASE_HOST: localhost
      GHM_NONPRODUCTION_DATABASE_NAME: ghm_disposable_test
      GHM_NONPRODUCTION_DATABASE_HOST: localhost
      GHM_QUALIFICATION_DATABASE_URL: postgres://ghm_runtime:runtime-test-password@localhost:5432/ghm_disposable_test
      GHM_STORAGE_QUALIFICATION_ALLOW_MUTATIONS: "true"
      DATABASE_SSL: "false"
      INVITE_CODE: test-invite-code
      CORS_ORIGINS: http://localhost:3000
      GHM_AUTH_TOKEN_PEPPER: ci-test-token-pepper-32-bytes-minimum-length-000
      GHM_ACTOR_GATEWAY_CAPABILITY_ASSERTION_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      GHM_STORAGE_PROVIDER_WORKFLOW_ATTESTATION_SECRET: cHJvdmlkZXItdGVzdC1zZWNyZXQtMzItYnl0ZS1rZXk=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ghm_disposable_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ghm_db_user LOGIN INHERIT CREATEDB CREATEROLE PASSWORD 'dashboard-admin-test-password';
          CREATE ROLE ghm_schema_owner NOLOGIN;
          CREATE ROLE ghm_migrator LOGIN NOINHERIT PASSWORD 'migrator-test-password';
          GRANT ghm_schema_owner TO ghm_migrator WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          CREATE ROLE ghm_runtime LOGIN NOINHERIT PASSWORD 'runtime-test-password';
          CREATE ROLE ghm_actor_gateway LOGIN NOINHERIT PASSWORD 'actor-gateway-test-password';
          CREATE ROLE ghm_auth_issuer LOGIN NOINHERIT PASSWORD 'auth-issuer-test-password';
          CREATE ROLE ghm_payment_provider LOGIN NOINHERIT PASSWORD 'provider-test-password';
          GRANT ghm_runtime, ghm_actor_gateway, ghm_auth_issuer, ghm_payment_provider
            TO ghm_db_user WITH ADMIN TRUE, INHERIT FALSE, SET FALSE;
          GRANT CONNECT ON DATABASE ghm_disposable_test TO ghm_db_user, ghm_migrator, ghm_runtime, ghm_payment_provider, ghm_actor_gateway, ghm_auth_issuer;
          GRANT CREATE ON DATABASE ghm_disposable_test TO ghm_schema_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO ghm_schema_owner;
          CREATE SCHEMA ghm AUTHORIZATION ghm_schema_owner;
          SQL

      - name: Reproduce PostgreSQL 18 delegated CREATEROLE membership behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ghm_disposable_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ghm_role_creator NOLOGIN CREATEROLE;
          SET ROLE ghm_role_creator;
          CREATE ROLE ghm_role_created LOGIN NOINHERIT;
          RESET ROLE;

          DO $do$
          DECLARE
            membership record;
          BEGIN
            SELECT pg_get_userbyid(m.grantor) AS grantor,
                   m.admin_option,
                   m.set_option,
                   m.inherit_option
              INTO membership
              FROM pg_auth_members m
              JOIN pg_roles member_role ON member_role.oid = m.member
              JOIN pg_roles granted_role ON granted_role.oid = m.roleid
             WHERE member_role.rolname = 'ghm_role_creator'
               AND granted_role.rolname = 'ghm_role_created';

            IF membership IS NULL
               OR membership.grantor <> 'postgres'
               OR membership.admin_option IS DISTINCT FROM true
               OR membership.set_option IS DISTINCT FROM false
               OR membership.inherit_option IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'Unexpected PostgreSQL 18 delegated CREATEROLE membership: %', membership;
            END IF;
          END
          $do$;

          SET ROLE ghm_role_creator;
          REVOKE ghm_role_created FROM ghm_role_creator;
          RESET ROLE;

          DO $do$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
                FROM pg_auth_members m
                JOIN pg_roles member_role ON member_role.oid = m.member
                JOIN pg_roles granted_role ON granted_role.oid = m.roleid
               WHERE member_role.rolname = 'ghm_role_creator'
                 AND granted_role.rolname = 'ghm_role_created'
                 AND m.grantor = 'postgres'::regrole
            ) THEN
              RAISE EXCEPTION 'Delegated creator unexpectedly revoked postgres-granted membership';
            END IF;
          END
          $do$;

          DROP ROLE ghm_role_created;
          DROP ROLE ghm_role_creator;
          SQL

      - name: Check auth issuer principal qualification script syntax
        run: node --check scripts/qualify-auth-issuer-principal.mjs

      - name: Check auth issuer cutover qualification script syntax
        run: node --check scripts/qualify-auth-issuer-cutover.mjs

      - name: Check storage qualification script syntax
        run: node --check scripts/qualify-storage-persistence.mjs

      - name: Check Business profile qualification script syntax
        run: node --check scripts/qualify-business-profile-contract-postgres.mjs

      - name: Check supplier classification qualification script syntax
        run: node --check scripts/qualify-business-supplier-classification-postgres.mjs

      - name: Check capability governance qualification script syntax
        run: node --check scripts/qualify-capability-catalogue-governance.mjs

      - name: Check signed capability actor assertion qualification syntax
        run: node --check scripts/qualify-capability-catalogue-governance.mjs

      - name: Check signed gateway principal qualification syntax
        run: node --check scripts/qualify-actor-gateway-principal.mjs

      - name: Check capability governance cutover qualification script syntax
        run: node --check scripts/qualify-capability-governance-cutover-postgres.mjs

      - name: Check Business Capability gateway cutover qualification script syntax
        run: node --check scripts/qualify-business-capability-gateway-cutover-postgres.mjs

      - name: Check Saved Business gateway cutover qualification script syntax
        run: node --check scripts/qualify-saved-business-gateway-cutover-postgres.mjs

      - name: Check Business Hours gateway cutover qualification script syntax
        run: node --check scripts/qualify-business-hours-gateway-cutover-postgres.mjs

      - name: Check Campaign and directory-review gateway qualification script syntax
        run: node --check scripts/qualify-campaign-directory-review-gateway-postgres.mjs

      - name: Check Trust Score gateway cutover qualification script syntax
        run: node --check scripts/qualify-trust-score-gateway-cutover-postgres.mjs

      - name: Check Business Logo gateway cutover qualification script syntax
        run: node --check scripts/qualify-business-logo-gateway-cutover-postgres.mjs

      - name: Check storage provider attestation provisioning script syntax
        run: node --check scripts/provision-storage-provider-attestation-secret.mjs

      - name: Check storage provider workflow qualification script syntax
        run: node --check scripts/qualify-storage-provider-workflow-attestation-postgres.mjs

      - name: Check storage metadata runtime grant qualification script syntax
        run: node --check scripts/qualify-storage-metadata-runtime-grant-revocation-postgres.mjs

      - name: Build
        run: npm run build

      - name: Bundle Actor Gateway Cloudflare Worker without deploying
        run: >-
          npx --yes wrangler@4.36.0 deploy --dry-run
          --outdir tmp/actor-gateway-worker-build
          --config workers/actor-gateway/wrangler.jsonc

      - name: Apply all migrations to disposable PostgreSQL
        run: npm run migrate

      - name: Check whole-database SECURITY DEFINER inventory script syntax
        run: node --check scripts/audit-security-definer-authority.mjs

      - name: Qualify isolated auth issuer database principal and empty privilege baseline
        run: npm run qualify:auth-issuer-principal

      - name: Qualify isolated actor gateway database principal
        run: npm run qualify:actor-gateway-principal

      - name: Provision provider attestation secret in disposable PostgreSQL
        env:
          GHM_STORAGE_PROVIDER_ATTESTATION_ALLOW_MUTATIONS: 'true'
        run: node scripts/provision-storage-provider-attestation-secret.mjs

      - name: Qualify storage provider dual-proof transitions on disposable PostgreSQL
        env:
          GHM_STORAGE_PROVIDER_ATTESTATION_ALLOW_MUTATIONS: 'true'
        run: node scripts/qualify-storage-provider-workflow-attestation-postgres.mjs

      - name: Qualify legacy storage metadata grant revocation and rollback on disposable PostgreSQL
        env:
          GHM_STORAGE_QUALIFICATION_ALLOW_MUTATIONS: 'true'
        run: node scripts/qualify-storage-metadata-runtime-grant-revocation-postgres.mjs
      - name: Qualify signed Connect Business provisioning, membership isolation and rollback
        run: npm run qualify:connect-business-provisioning-live

      - name: Qualify Business registration forward migration against existing table
        run: node scripts/qualify-business-registration-forward-migration.mjs

      - name: Seed disposable storage qualification fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ghm_disposable_test -v ON_ERROR_STOP=1 <<'SQL'
          WITH fixture_account AS (
            INSERT INTO ghm.account_identity (full_name, role)
            VALUES ('CI Storage Qualification Member', 'business')
            RETURNING id
          ),
          fixture_business AS (
            INSERT INTO ghm.business (name, slug, verification_status, is_active)
            VALUES ('CI Storage Qualification Business', 'ci-storage-qualification-' || gen_random_uuid()::text, 'unverified', true)
            RETURNING id
          )
          INSERT INTO ghm.business_membership (business_id, account_id, membership_role, membership_status)
          SELECT fixture_business.id, fixture_account.id, 'owner', 'active'
          FROM fixture_business CROSS JOIN fixture_account;
          SQL

      - name: Qualify storage getter on disposable PostgreSQL
        run: node scripts/qualify-storage-getter-postgres.mjs

      - name: Qualify Opportunity marketplace SQL on disposable PostgreSQL
        run: npm run qualify:opportunity-marketplace

      - name: Qualify storage lifecycle and tenant authorization on disposable PostgreSQL
        run: node scripts/qualify-storage-persistence.mjs

      - name: Test suite
        run: npm test

      - name: Qualify Campaign and directory-review signed actor gateway on disposable PostgreSQL
        run: npm run qualify:campaign-directory-review-gateway

      - name: Qualify Business Capability lifecycle and two-session assertion replacement on disposable PostgreSQL
        run: npm run qualify:business-capability-lifecycle-runtime

      - name: Qualify system-admin Capability catalogue governance on disposable PostgreSQL
        run: npm run qualify:capability-catalogue-governance

      - name: Qualify capability legacy RPC cutover and gateway-only access on disposable PostgreSQL
        run: npm run qualify:capability-governance-cutover

      - name: Qualify Business Capability signed gateway cutover on disposable PostgreSQL
        run: npm run qualify:business-capability-gateway-cutover

      - name: Qualify Saved Business signed gateway cutover on disposable PostgreSQL
        run: npm run qualify:saved-business-gateway-cutover

      - name: Qualify Business Hours signed gateway cutover on disposable PostgreSQL
        run: npm run qualify:business-hours-gateway-cutover


      - name: Qualify Trust Score signed gateway cutover on disposable PostgreSQL
        run: npm run qualify:trust-score-gateway-cutover

      - name: Qualify Business Logo signed gateway cutover on disposable PostgreSQL
        run: npm run qualify:business-logo-gateway-cutover

      - name: Qualify GHM supplier classification and membership authorization on disposable PostgreSQL
        run: npm run qualify:business-supplier-classification

      - name: Qualify Business profile gateway and compatibility contract on disposable PostgreSQL
        run: npm run qualify:business-profile-contract

      - name: Qualify commercial payment settlement identities against disposable PostgreSQL
        run: npm run build && node scripts/qualify-commercial-payment-result-runtime.mjs

      - name: Migration audit policy tests
        run: npm run test:migration-audit-policy

      - name: Runtime boundary verification
        run: npm run verify:runtime

      - name: Inventory SECURITY DEFINER authority immediately before issuer cutover
        run: npm run audit:security-definer-authority

      - name: Qualify exact pre-issuer Resource API authentication grants
        run: node scripts/qualify-auth-issuer-precutover.mjs

      - name: Apply guarded auth issuer manual cutover in disposable PostgreSQL only
        env:
          PGPASSWORD: migrator-test-password
        run: >-
          psql -h localhost -U ghm_migrator -d ghm_disposable_test -v ON_ERROR_STOP=1
          -c 'SET ROLE ghm_schema_owner'
          -f database/cutovers/20261112010000_authentication_issuer_privilege_cutover.sql
          -c 'RESET ROLE'
      - name: Qualify isolated auth issuer lifecycle and runtime denials on disposable PostgreSQL
        run: npm run qualify:auth-issuer-cutover

      - name: Inventory SECURITY DEFINER authority after disposable issuer cutover
        env:
          GHM_SECURITY_DEFINER_AUDIT_OUTPUT: tmp/security-definer-authority-audit-post-issuer-cutover.json
        run: npm run audit:security-definer-authority

      - name: Compare pre- and post-cutover SECURITY DEFINER authority inventories
        run: |
          node --test scripts/compare-security-definer-authority-inventories.test.mjs
          node scripts/compare-security-definer-authority-inventories.mjs

      - name: Preserve pre-, post-cutover and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-definer-authority-inventory
          path: tmp/security-definer-authority*.json
          if-no-files-found: warn
          retention-days: 14

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Audit web dependency tree
        working-directory: web
        run: npm audit --audit-level=moderate

      - name: Verify resolved security-sensitive toolchain
        working-directory: web
        run: npm ls vite vitest @vitest/mocker source-map-js
