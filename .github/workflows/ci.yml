name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ghm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ghm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ghm_runtime:runtime-test-password@localhost:5432/ghm
      GHM_RUNTIME_DATABASE_URL: postgres://ghm_runtime:runtime-test-password@localhost:5432/ghm
      GHM_MIGRATOR_DATABASE_URL: postgres://ghm_migrator:migrator-test-password@localhost:5432/ghm
      GHM_MIGRATION_DATABASE_NAME: ghm
      GHM_MIGRATION_DATABASE_HOST: localhost
      GHM_QUALIFICATION_DATABASE_NAME: ghm
      GHM_QUALIFICATION_DATABASE_HOST: localhost
      GHM_NONPRODUCTION_DATABASE_NAME: ghm
      GHM_NONPRODUCTION_DATABASE_HOST: localhost
      DATABASE_SSL: "false"
      INVITE_CODE: test-invite-code
      CORS_ORIGINS: http://localhost:3000
      GHM_AUTH_TOKEN_PEPPER: ci-test-token-pepper-32-bytes-minimum-length-000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ghm -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ghm_schema_owner NOLOGIN;
          CREATE ROLE ghm_migrator LOGIN NOINHERIT PASSWORD 'migrator-test-password';
          GRANT ghm_schema_owner TO ghm_migrator;
          CREATE ROLE ghm_runtime LOGIN NOINHERIT PASSWORD 'runtime-test-password';
          GRANT CONNECT ON DATABASE ghm TO ghm_migrator, ghm_runtime;
          GRANT CREATE ON DATABASE ghm TO ghm_schema_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO ghm_schema_owner;
          SQL

      - name: Check storage qualification script syntax
        run: node --check scripts/qualify-storage-persistence.mjs

      - name: Build
        run: npm run build

      - name: Apply all migrations to disposable PostgreSQL
        run: npm run migrate

      - name: Test suite
        run: npm test

      - name: Migration audit policy tests
        run: npm run test:migration-audit-policy

      - name: Runtime boundary verification
        run: npm run verify:runtime
