<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHM Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 40px; border-radius: 8px; border: 1px solid #333; max-width: 400px; width: 100%; }
        h1 { text-align: center; color: #24b47e; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #24b47e; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        #auth-message { color: #ff6b6b; text-align: center; margin-top: 15px; }
        a { color: #24b47e; text-decoration: none; display: block; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GHM Login</h1>
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="signup()" style="background:#555;">Sign Up</button>
        <p id="auth-message"></p>
        <a href="dashboard.html">Go to Dashboard</a>
    </div>

    <script>
        // DO NOT navigate to this URL. Only fetch it.
        const API_URL = 'https://ghm-core.onrender.com/api/v1';
        let authToken = localStorage.getItem('token');

        async function login() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                // This is a POST request, which the backend accepts
                const response = await fetch(`${API_URL}/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('auth-message').innerText = err.message;
            }
        }

        async function signup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const invite_code = prompt("Enter your invite code:");
            
            try {
                // This is a POST request, which the backend accepts
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, invite_code })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('auth-message').innerText = err.message;
            }
        }
    </script>
</body>
</html>
