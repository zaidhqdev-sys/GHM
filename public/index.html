<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHM Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; color: #ccc; }
        .container { max-width: 400px; width: 100%; background: #1e1e1e; padding: 40px; border-radius: 8px; border: 1px solid #333; }
        h1 { color: #24b47e; text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 4px; background: #222; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #24b47e; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:hover { background: #1a9b67; }
        #auth-message { text-align: center; color: #ff6b6b; margin-top: 10px; }
        #dashboard-btn { text-decoration: none; color: #24b47e; text-align: center; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GHM Login</h1>
        <div class="input-group">
            <input type="email" id="auth-email" placeholder="Email">
        </div>
        <div class="input-group">
            <input type="password" id="auth-password" placeholder="Password">
        </div>
        <button onclick="login()">Login</button>
        <button onclick="signup()" style="background: #555;">Sign Up</button>
        <p id="auth-message"></p>
        <a href="dashboard.html" id="dashboard-btn">Go to Dashboard</a>
    </div>
    <script>
    const API_URL = 'https://ghm-core.onrender.com';
    let authToken = localStorage.getItem('token');

    async function login() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        try {
            const response = await fetch(`${API_URL}/api/v1/auth/signin`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            localStorage.setItem('token', data.token);
            window.location.href = '/dashboard.html';
        } catch (err) {
            // This catches the error and shows it clearly
            document.getElementById('auth-message').innerText = err.message;
        }
    }

    async function signup() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const invite_code = prompt("Enter your GHM invite code:");
        try {
            const response = await fetch(`${API_URL}/api/v1/auth/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, invite_code })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            localStorage.setItem('token', data.token);
            window.location.href = '/dashboard.html';
        } catch (err) {
            document.getElementById('auth-message').innerText = err.message;
        }
    }
</script>
</body>
</html>
